services:
  # Backend Web Service
  - type: web
    name: edupulse-backend
    env: docker
    region: singapore
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # The database password and JWT secret must be injected via the Render Dashboard
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        value: <your-neon-host>.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: edupulse
      - key: DB_USER
        value: edupulse_user
      - key: APP_CORS_ALLOWED_ORIGINS
        value: <your-frontend-url>

  # Frontend Static Site
  - type: web
    name: edupulse-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: <your-backend-url>/api
