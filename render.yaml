services:
  # Backend Web Service
  - type: web
    name: edupulse-backend
    env: docker
    region: singapore
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # The database password, JWT secret, and host must be configured in Render Dashboard
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: edupulse
      - key: DB_USER
        value: edupulse_owner
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Optional: full JDBC connection string can be provided instead of individual DB_* variables
      - key: JDBC_DATABASE_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: edupulse-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
