<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { width: 320px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    p { font-size: 12px; color: #666; margin: 0 0 10px; }
    button { width: 100%; padding: 9px; font-size: 13px; font-weight: 600; border: 0; border-radius: 8px; cursor: pointer; }
    #extract { background: #4f46e5; color: #fff; }
    #download { background: #e5e7eb; color: #111; margin-top: 8px; }
    button:disabled { opacity: .5; cursor: default; }
    #result { font-size: 12px; margin-top: 10px; }
    .ok { color: #047857; }
    .warn { color: #b45309; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>EduPulse Record Importer</h1>
  <p>Open your attendance / marks / exam-ledger report in the SRM portal, then click below. Your data is read on this device and personal details (name, DOB, gender, photo) are removed.</p>
  <button id="extract">Extract my records</button>
  <button id="download" disabled>Download clean file (.json)</button>
  <div id="result"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
