spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edupulse}?sslmode=require}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://edupulse-frontend-lpnl.onrender.com,http://localhost:5173,http://localhost:4173}
  seeder:
    enabled: ${SEED_DEMO_DATA:false}
    demo-password: ${DEMO_USER_PASSWORD:DemoEduPulse2026!}


