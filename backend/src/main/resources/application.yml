server:
  port: ${PORT:8080}

spring:
  application:
    name: edupulse
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edupulse}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway owns the schema in every PostgreSQL environment. Existing databases created before
    # Flyway are baselined at V1 (the baseline schema) and then receive forward-only migrations.
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Hibernate never alters the schema; it only validates entities against Flyway's schema.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  seeder:
    enabled: ${SEED_DEMO_DATA:${SEED_DB:false}}
    demo-password: ${DEMO_USER_PASSWORD:DemoEduPulse2026!}


